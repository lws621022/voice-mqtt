<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>語音 MQTT 控制</title>

    <style>
        body {
            margin: 0;
            padding: 25px;
            background-color: #f3f6f8;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
        }

        .setting-link {
            display: inline-block;
            margin: 2px 0 18px;
            padding: 12px 22px;
            border-radius: 10px;
            background-color: #6a1b9a;
            color: white;
            font-size: 20px;
            text-decoration: none;
        }

        .topic-setting {
            margin-top: 12px;
            padding: 18px;
            background-color: #e8f4ff;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 21px;
            font-weight: bold;
        }

        input {
            width: 80%;
            max-width: 320px;
            padding: 13px;
            border: 2px solid #999999;
            border-radius: 8px;
            font-size: 23px;
            text-align: center;
        }

        button {
            margin: 14px 8px;
            padding: 15px 26px;
            border: none;
            border-radius: 12px;
            background-color: #1976d2;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        #setTopicButton {
            background-color: #00897b;
        }

        .box {
            margin-top: 18px;
            padding: 15px;
            background-color: #eef3f7;
            border-radius: 10px;
            font-size: 20px;
            line-height: 1.7;
            word-break: break-word;
        }

        #mqttStatus,
        #topicStatus,
        #commandStatus {
            font-weight: bold;
        }

        #result {
            min-height: 45px;
            margin-top: 8px;
            font-size: 30px;
            font-weight: bold;
        }

        #command {
            min-height: 42px;
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
        }

        #topicText {
            margin-top: 5px;
            font-size: 25px;
            font-weight: bold;
        }

        .connected {
            color: green;
        }

        .waiting {
            color: #d06a00;
        }

        .disconnected {
            color: red;
        }

        .command-list {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff8e1;
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.9;
            text-align: left;
        }

        .small-text {
            font-size: 15px;
            color: #666666;
        }

        .command-item {
            padding: 5px 0;
            border-bottom: 1px solid #dddddd;
        }

        .command-item:last-child {
            border-bottom: none;
        }
    </style>

    <!-- 載入 MQTT.js -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>🎤 語音 MQTT 控制</h1>

        <a href="setting.html" class="setting-link">
            ⚙️ 語音指令設定
        </a>

        <p>
            請先輸入自己的學號或代號並設定 Topic，<br>
            再使用語音控制。
        </p>

        <!-- Topic 設定區 -->
        <div class="topic-setting">

            <label for="studentId">
                請輸入學號或代號
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="例如：413501"
                autocomplete="off"
            >

            <br>

            <button id="setTopicButton">
                設定 Topic
            </button>

            <div>
                設定狀態：
                <span id="topicStatus" class="waiting">
                    尚未設定
                </span>
            </div>

        </div>

        <div class="box">
            MQTT 狀態：
            <span id="mqttStatus" class="waiting">
                準備連線……
            </span>
        </div>

        <div class="box">
            目前 MQTT Topic：
            <div id="topicText">
                尚未設定
            </div>
        </div>

        <div class="box">
            語音指令設定：
            <span id="commandStatus" class="waiting">
                讀取中……
            </span>
        </div>

        <button id="startButton" disabled>
            🎤 開始語音辨識
        </button>

        <div class="box">
            語音辨識狀態：
            <span id="speechStatus">
                尚未開始
            </span>
        </div>

        <div class="box">
            辨識結果：
            <div id="result">
                尚無結果
            </div>
        </div>

        <div class="box">
            MQTT 指令：
            <div id="command">
                尚未傳送
            </div>
        </div>

        <div class="command-list">
            <strong>目前可用指令：</strong>
            <div id="commandListText"></div>
        </div>

        <div class="box small-text">
            Broker：
            <br>
            wss://mqttgo.io:8084
            <br><br>
            Client ID：
            <br>
            <span id="clientIdText"></span>
        </div>

    </div>

    <script>
        // ==========================================
        // 預設語音指令
        // ==========================================

        const defaultCommands = [
            {
                keyword: "開燈",
                message: "on"
            },
            {
                keyword: "關燈",
                message: "off"
            },
            {
                keyword: "紅色",
                message: "red"
            },
            {
                keyword: "藍色",
                message: "blue"
            },
            {
                keyword: "彩虹燈",
                message: "rainbow"
            },
            {
                keyword: "播放音樂",
                message: "music"
            }
        ];

        const storageKey = "voiceCommands";

        // 實際使用的指令陣列
        let voiceCommands = [];

        // ==========================================
        // MQTT 基本設定
        // ==========================================

        const brokerUrl = "wss://mqttgo.io:8084";

        // 尚未設定 Topic 時保持空字串
        let mqttTopic = "";

        // 每台裝置產生不同的 Client ID
        const clientId =
            "voice_" +
            Date.now() +
            "_" +
            Math.random().toString(16).substring(2, 8);

        // ==========================================
        // 取得網頁元件
        // ==========================================

        const studentIdInput =
            document.getElementById("studentId");

        const setTopicButton =
            document.getElementById("setTopicButton");

        const topicStatus =
            document.getElementById("topicStatus");

        const mqttStatus =
            document.getElementById("mqttStatus");

        const commandStatus =
            document.getElementById("commandStatus");

        const startButton =
            document.getElementById("startButton");

        const speechStatus =
            document.getElementById("speechStatus");

        const resultText =
            document.getElementById("result");

        const commandText =
            document.getElementById("command");

        const topicText =
            document.getElementById("topicText");

        const commandListText =
            document.getElementById("commandListText");

        const clientIdText =
            document.getElementById("clientIdText");

        clientIdText.textContent = clientId;

        // ==========================================
        // 讀取語音指令設定
        // ==========================================

        function loadVoiceCommands() {
            const savedData =
                localStorage.getItem(storageKey);

            if (!savedData) {
                voiceCommands = defaultCommands;

                commandStatus.textContent =
                    "使用預設設定，共 " +
                    voiceCommands.length +
                    " 組";

                commandStatus.className =
                    "waiting";

                displayCommandList();

                return;
            }

            try {
                const parsedData =
                    JSON.parse(savedData);

                if (
                    Array.isArray(parsedData) &&
                    parsedData.length > 0
                ) {
                    /*
                        再次過濾，確保每一組都有
                        keyword 和 message。
                    */
                    voiceCommands =
                        parsedData.filter(function (item) {
                            return (
                                item &&
                                typeof item.keyword === "string" &&
                                typeof item.message === "string" &&
                                item.keyword.trim() !== "" &&
                                item.message.trim() !== ""
                            );
                        });

                    if (voiceCommands.length > 0) {
                        commandStatus.textContent =
                            "已載入自訂設定，共 " +
                            voiceCommands.length +
                            " 組";

                        commandStatus.className =
                            "connected";
                    } else {
                        voiceCommands = defaultCommands;

                        commandStatus.textContent =
                            "設定無有效內容，改用預設設定";

                        commandStatus.className =
                            "waiting";
                    }
                } else {
                    voiceCommands = defaultCommands;

                    commandStatus.textContent =
                        "設定格式無效，改用預設設定";

                    commandStatus.className =
                        "waiting";
                }
            } catch (error) {
                console.error(
                    "讀取語音設定失敗：",
                    error
                );

                voiceCommands = defaultCommands;

                commandStatus.textContent =
                    "讀取失敗，改用預設設定";

                commandStatus.className =
                    "disconnected";
            }

            displayCommandList();
        }

        // ==========================================
        // 顯示目前可用指令
        // ==========================================

        function displayCommandList() {
            commandListText.innerHTML = "";

            voiceCommands.forEach(
                function (item, index) {
                    const commandItem =
                        document.createElement("div");

                    commandItem.className =
                        "command-item";

                    commandItem.textContent =
                        (index + 1) +
                        ". 「" +
                        item.keyword +
                        "」→ " +
                        item.message;

                    commandListText.appendChild(
                        commandItem
                    );
                }
            );
        }

        // ==========================================
        // 檢查 MQTT.js 是否成功載入
        // ==========================================

        if (typeof mqtt === "undefined") {
            mqttStatus.textContent =
                "MQTT.js 載入失敗";

            mqttStatus.className =
                "disconnected";

            commandText.textContent =
                "請檢查網路或重新整理網頁";

            throw new Error("MQTT.js 載入失敗");
        }

        // ==========================================
        // 連接 MQTTGO
        // ==========================================

        mqttStatus.textContent = "連線中……";
        mqttStatus.className = "waiting";

        const client = mqtt.connect(brokerUrl, {
            clientId: clientId,

            // 使用 MQTT 3.1.1
            protocolVersion: 4,

            clean: true,
            keepalive: 30,
            connectTimeout: 15000,

            // 中斷後每隔 3 秒重新連線
            reconnectPeriod: 3000
        });

        // ==========================================
        // MQTT 連線事件
        // ==========================================

        client.on("connect", function () {
            mqttStatus.textContent = "已連線";
            mqttStatus.className = "connected";

            updateStartButton();

            console.log("MQTT 連線成功");
            console.log("Client ID：", clientId);
        });

        client.on("reconnect", function () {
            mqttStatus.textContent =
                "重新連線中……";

            mqttStatus.className =
                "waiting";

            startButton.disabled = true;
        });

        client.on("offline", function () {
            mqttStatus.textContent =
                "目前離線，等待重連……";

            mqttStatus.className =
                "disconnected";

            startButton.disabled = true;
        });

        client.on("close", function () {
            if (!client.connected) {
                mqttStatus.textContent =
                    "連線中斷，正在重試……";

                mqttStatus.className =
                    "disconnected";

                startButton.disabled = true;
            }
        });

        client.on("error", function (error) {
            mqttStatus.textContent =
                "連線錯誤：" + error.message;

            mqttStatus.className =
                "disconnected";

            startButton.disabled = true;

            console.error("MQTT 錯誤：", error);
        });

        // ==========================================
        // 設定 Topic
        // ==========================================

        setTopicButton.addEventListener(
            "click",
            function () {
                const studentId =
                    studentIdInput.value.trim();

                // 只檢查是否有輸入
                if (studentId === "") {
                    topicStatus.textContent =
                        "請先輸入學號或代號";

                    topicStatus.className =
                        "disconnected";

                    mqttTopic = "";

                    topicText.textContent =
                        "尚未設定";

                    startButton.disabled = true;

                    return;
                }

                mqttTopic = "tlhc/" + studentId;

                topicText.textContent = mqttTopic;

                topicStatus.textContent =
                    "設定完成";

                topicStatus.className =
                    "connected";

                commandText.textContent =
                    "尚未傳送";

                updateStartButton();

                console.log(
                    "目前 MQTT Topic：",
                    mqttTopic
                );
            }
        );

        // 在輸入框按 Enter 也能設定 Topic
        studentIdInput.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    setTopicButton.click();
                }
            }
        );

        // ==========================================
        // 更新語音按鈕狀態
        // ==========================================

        function updateStartButton() {
            startButton.disabled =
                !client.connected ||
                mqttTopic === "";
        }

        // ==========================================
        // 傳送 MQTT 指令
        // ==========================================

        function sendCommand(command) {
            if (!client.connected) {
                commandText.textContent =
                    "MQTT 尚未連線";

                return;
            }

            if (mqttTopic === "") {
                commandText.textContent =
                    "請先設定 Topic";

                return;
            }

            commandText.textContent =
                command + "（傳送中……）";

            client.publish(
                mqttTopic,
                command,
                {
                    qos: 0,
                    retain: false
                },
                function (error) {
                    if (error) {
                        commandText.textContent =
                            command + "（傳送失敗）";

                        console.error(
                            "MQTT 傳送失敗：",
                            error
                        );
                    } else {
                        commandText.textContent =
                            command + "（已傳送）";

                        console.log(
                            "MQTT Topic：",
                            mqttTopic
                        );

                        console.log(
                            "MQTT 訊息：",
                            command
                        );
                    }
                }
            );
        }

        // ==========================================
        // 清理語音文字
        // ==========================================

        function cleanSpeechText(text) {
            return text
                .replace(/\s/g, "")
                .replace(/[，。！？,.!?；;：:]/g, "")
                .toLowerCase();
        }

        // ==========================================
        // 判斷自訂語音指令
        // ==========================================

        function processSpeech(text) {
            const cleanText =
                cleanSpeechText(text);

            for (
                let i = 0;
                i < voiceCommands.length;
                i++
            ) {
                const item =
                    voiceCommands[i];

                const cleanKeyword =
                    cleanSpeechText(
                        item.keyword
                    );

                if (
                    cleanKeyword !== "" &&
                    cleanText.includes(cleanKeyword)
                ) {
                    sendCommand(item.message);
                    return;
                }
            }

            commandText.textContent =
                "找不到對應指令";
        }

        // ==========================================
        // 語音辨識設定
        // ==========================================

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            startButton.disabled = true;

            speechStatus.textContent =
                "此瀏覽器不支援語音辨識";
        } else {
            const recognition =
                new SpeechRecognition();

            recognition.lang = "zh-TW";
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            startButton.addEventListener(
                "click",
                function () {
                    if (!client.connected) {
                        commandText.textContent =
                            "MQTT 尚未連線";

                        return;
                    }

                    if (mqttTopic === "") {
                        commandText.textContent =
                            "請先設定 Topic";

                        return;
                    }

                    /*
                        每次開始辨識前重新載入設定，
                        因此從 setting.html 返回後，
                        不必關閉整個 Safari。
                    */
                    loadVoiceCommands();

                    resultText.textContent =
                        "請開始說話……";

                    commandText.textContent =
                        "等待辨識";

                    speechStatus.textContent =
                        "正在啟動麥克風……";

                    startButton.disabled = true;

                    try {
                        recognition.start();
                    } catch (error) {
                        speechStatus.textContent =
                            "語音辨識已在執行中";

                        updateStartButton();

                        console.error(
                            "語音辨識啟動錯誤：",
                            error
                        );
                    }
                }
            );

            recognition.onstart = function () {
                speechStatus.textContent =
                    "正在聆聽";
            };

            recognition.onresult = function (event) {
                const transcript =
                    event.results[0][0].transcript;

                resultText.textContent =
                    transcript;

                speechStatus.textContent =
                    "辨識完成";

                processSpeech(transcript);
            };

            recognition.onerror = function (event) {
                speechStatus.textContent =
                    "錯誤：" + event.error;

                commandText.textContent =
                    "未傳送指令";

                console.error(
                    "語音辨識錯誤：",
                    event.error
                );
            };

            recognition.onend = function () {
                if (
                    speechStatus.textContent ===
                    "正在聆聽" ||
                    speechStatus.textContent ===
                    "正在啟動麥克風……"
                ) {
                    speechStatus.textContent =
                        "辨識已結束";
                }

                updateStartButton();
            };
        }

        // ==========================================
        // 網頁開啟時讀取指令
        // ==========================================

        loadVoiceCommands();

        /*
            從 setting.html 返回 index.html，
            或切換回此分頁時，再讀取一次設定。
        */
        window.addEventListener(
            "pageshow",
            function () {
                loadVoiceCommands();
            }
        );
    </script>

</body>

</html>
