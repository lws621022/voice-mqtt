<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>iPad 語音辨識測試</title>

    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            font-size: 32px;
        }

        button {
            font-size: 24px;
            padding: 16px 30px;
            margin: 20px;
            cursor: pointer;
        }

        #status {
            font-size: 22px;
            margin-top: 20px;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 50px;
        }

        #supportMessage {
            margin-top: 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>iPad 語音辨識測試</h1>

    <p>按下按鈕後，請說「開燈」或其他中文句子。</p>

    <button id="startButton">🎤 開始語音辨識</button>

    <div id="status">狀態：尚未開始</div>

    <div id="result">辨識結果會顯示在這裡</div>

    <div id="supportMessage"></div>

    <script>
        const startButton = document.getElementById("startButton");
        const statusText = document.getElementById("status");
        const resultText = document.getElementById("result");
        const supportMessage =
            document.getElementById("supportMessage");

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            startButton.disabled = true;

            supportMessage.textContent =
                "這個瀏覽器目前不支援網頁語音辨識。";

            statusText.textContent =
                "狀態：不支援語音辨識";
        } else {
            const recognition = new SpeechRecognition();

            recognition.lang = "zh-TW";
            recognition.continuous = false;
            recognition.interimResults = false;

            startButton.addEventListener("click", function () {
                resultText.textContent = "請開始說話……";
                statusText.textContent = "狀態：正在聆聽";

                try {
                    recognition.start();
                } catch (error) {
                    statusText.textContent =
                        "狀態：語音辨識正在執行中";
                }
            });

            recognition.onresult = function (event) {
                const transcript =
                    event.results[0][0].transcript;

                resultText.textContent = transcript;
                statusText.textContent = "狀態：辨識完成";
            };

            recognition.onerror = function (event) {
                statusText.textContent =
                    "狀態：發生錯誤－" + event.error;
            };

            recognition.onend = function () {
                if (statusText.textContent ===
                    "狀態：正在聆聽") {

                    statusText.textContent =
                        "狀態：辨識已結束";
                }
            };
        }
    </script>

</body>
</html>
